name: Node.js validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - name: Smoke test server
        run: |
          npm start > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail http://localhost:3000/api/posts > /dev/null; then
              curl --fail http://localhost:3000/ > /dev/null
              curl --fail http://localhost:3000/discussions.html > /dev/null
              curl --fail http://localhost:3000/about.html > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
